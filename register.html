<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - UniMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5 app-container d-flex flex-column justify-content-center" style="min-height: 100vh;">
        <div class="card p-4 shadow-sm mx-auto" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <div class="text-start mb-3">
                    <a href="login.html" class="text-decoration-none text-muted small">← Quay lại Đăng nhập</a>
                </div>
                <h3 class="text-primary fw-bold">Tạo tài khoản</h3>
                <p class="text-muted small">Bắt đầu tìm kiếm người ở ghép lý tưởng</p>
            </div>

            <!-- Nơi hiển thị lỗi đỏ -->
            <div id="reg-error" class="alert alert-danger p-2 small d-none" role="alert"></div>

            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Họ và tên</label>
                <input id="reg-name" type="text" class="form-control" placeholder="Nhập họ tên của bạn">
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Email sinh viên (Có đuôi .edu.vn)</label>
                <input id="reg-email" type="email" class="form-control" placeholder="Mã số sinh viên/Email">
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium text-secondary small">Tạo mật khẩu</label>
                <input id="reg-password" type="password" class="form-control" placeholder="Ít nhất 6 ký tự">
            </div>

            <button id="btn-register" class="btn btn-primary w-100 py-2 fw-bold mb-3" onclick="handleRegister()">
                Tạo tài khoản
            </button>

            <div class="text-center small">
                <span class="text-muted">Đã có tài khoản? </span>
                <a href="login.html" class="text-primary fw-bold text-decoration-none">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('reg-error');
            const btnRegister = document.getElementById('btn-register');

            // 1. Reset lỗi
            errorDiv.classList.add('d-none');
            errorDiv.innerText = '';

            // 2. Validate dữ liệu
            if (name === "" || email === "" || password === "") {
                errorDiv.innerText = "⚠️ Vui lòng điền đầy đủ tất cả các trường.";
                errorDiv.classList.remove('d-none');
                return;
            }

            if (!email.endsWith(".edu.vn")) {
                errorDiv.innerText = "⚠️ Ứng dụng chỉ dành cho sinh viên. Vui lòng dùng email đuôi .edu.vn";
                errorDiv.classList.remove('d-none');
                return;
            }

            if (password.length < 6) {
                errorDiv.innerText = "⚠️ Mật khẩu phải có ít nhất 6 ký tự.";
                errorDiv.classList.remove('d-none');
                return;
            }

            // 3. Giả lập hiệu ứng Loading
            btnRegister.innerHTML = '⏳ Đang tạo tài khoản...';
            btnRegister.disabled = true;

            setTimeout(() => {
                // Đăng ký xong, điều hướng thẳng sang trang xác thực E-KYC và trắc nghiệm lối sống
                window.location.href = 'multiple_choice.html';
            }, 1200);
        }
    </script>
</body>

</html>
