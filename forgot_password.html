<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - UniMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5 d-flex flex-column justify-content-center" style="min-height: 100vh; max-width: 500px;">
        <div class="card p-4 p-md-5 shadow-sm border-0">

            <div class="text-start mb-3">
                <a href="login.html" class="text-decoration-none text-muted small fw-bold">← Quay lại Đăng nhập</a>
            </div>

            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center mx-auto mb-3"
                    style="width: 65px; height: 65px; font-size: 1.8rem;">
                    🔐
                </div>
                <h3 class="text-primary fw-bold">Quên mật khẩu?</h3>
                <p class="text-muted small">Đừng lo! Hãy nhập email sinh viên (.edu.vn) của bạn, hệ thống sẽ gửi
                    liên kết để khôi phục mật khẩu.</p>
            </div>

            <div id="success-alert" class="alert alert-success alert-custom d-none small mb-4" role="alert">
                ✅ <strong>Đã gửi liên kết!</strong> Vui lòng kiểm tra hộp thư đến (và mục Spam) trong email sinh viên
                của bạn.
            </div>

            <div id="form-section">
                <div class="mb-4">
                    <label class="form-label fw-medium text-secondary small">Email sinh viên</label>
                    <input id="input-email" type="email" class="form-control" placeholder="nguyenvana@nttu.edu.vn">
                </div>

                <button id="btn-submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow-sm"
                    onclick="handleResetPassword()">
                    Gửi liên kết khôi phục
                </button>
            </div>

            <div class="text-center small mt-2">
                <span class="text-muted">Nhớ ra mật khẩu rồi? </span>
                <a href="login.html" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a>
            </div>

        </div>
    </div>

    <script>
        function handleResetPassword() {
            const emailInput = document.getElementById('input-email');
            const emailValue = emailInput.value.trim();

            // Kiểm tra xem người dùng đã nhập email chưa
            if (!emailValue) {
                alert('Vui lòng nhập địa chỉ email của bạn!');
                emailInput.focus();
                return;
            }

            // Hiệu ứng đang tải cho nút bấm
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerHTML = '⏳ Đang gửi hệ thống...';
            btnSubmit.disabled = true;

            // Giả lập thời gian gửi mail mất 1.5 giây
            setTimeout(() => {
                // Ẩn form nhập đi, hiện thông báo thành công lên
                document.getElementById('form-section').classList.add('d-none');
                document.getElementById('success-alert').classList.remove('d-none');
            }, 1500);
        }
    </script>
</body>

</html>
