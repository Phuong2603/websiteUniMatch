<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã lưu - UniMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div id="navbar-placeholder"></div>

    <div class="container py-4" style="max-width: 1100px; min-height: 100vh;">
        <div class="d-flex align-items-center gap-2 mb-4">
            <h3 class="fw-bold text-dark mb-0">❤️ Danh sách yêu thích</h3>
            <span class="badge bg-danger rounded-pill" id="saved-count">0</span>
        </div>

        <!-- Sân bãi chứa các phòng đã lưu -->
        <div class="row g-4" id="saved-rooms-container">
            <!-- JS sẽ bơm dữ liệu vào đây -->
        </div>

        <!-- Trạng thái trống (Nếu chưa lưu phòng nào) -->
        <div id="empty-state" class="text-center py-5 d-none">
            <div class="fs-1 mb-3">💔</div>
            <h4 class="fw-bold text-dark">Bạn chưa lưu căn phòng nào!</h4>
            <p class="text-muted">Hãy ra Bảng tin và thả tim những căn phòng bạn ưng ý để xem lại sau nhé.</p>
            <button class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm mt-2" onclick="window.location.href='dashboard.html'">🔍 Khám phá ngay</button>
        </div>
    </div>

    <!-- Scripts chung -->
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nạp Footer -->
    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);
    </script>

    <!-- KẾT NỐI API VÀ LỌC PHÒNG TỪ LOCAL STORAGE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy danh sách ID đã lưu từ bộ nhớ trình duyệt
            const savedRoomsIDs = JSON.parse(localStorage.getItem('savedRooms')) || [];
            const container = document.getElementById('saved-rooms-container');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('saved-count').innerText = savedRoomsIDs.length;

            if (savedRoomsIDs.length === 0) {
                emptyState.classList.remove('d-none');
                return;
            }

            // Lấy toàn bộ phòng từ API về
            fetch('http://localhost:3000/api/rooms')
                .then(res => res.json())
                .then(allRooms => {
                    // Cỗ máy lọc: Chỉ giữ lại những phòng có ID nằm trong danh sách đã thả tim
                    const favoriteRooms = allRooms.filter(room => savedRoomsIDs.includes(room._id));

                    // Nếu lỡ ID lưu trên máy có mà trên DB bị chủ trọ xóa rồi -> Báo rỗng
                    if(favoriteRooms.length === 0) {
                        emptyState.classList.remove('d-none');
                        return;
                    }

                    // Vẽ ra màn hình
                    favoriteRooms.forEach(room => {
                        let utilitiesHtml = room.utilities.map(util => `<span class="badge bg-light text-dark border">${util}</span>`).join('');
                        container.innerHTML += `
                        <div class="col-12 col-md-6 col-lg-4" id="room-card-${room._id}">
                            <div class="card listing-card shadow-sm h-100 border-0">
                                <div class="position-relative">
                                    <img src="${room.image}" class="room-img w-100" style="height: 200px; object-fit: cover;" alt="Phòng trọ">
                                    <button class="position-absolute top-0 end-0 m-2 btn-favorite fs-5 active" onclick="removeSavedRoom('${room._id}')">❤️</button>
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h6 class="fw-bold text-dark mb-2">${room.title}</h6>
                                    <h5 class="fw-bold text-primary mb-2">${room.price}</h5>
                                    <p class="text-muted small mb-3">${room.address}</p>
                                    <div class="d-flex gap-2 mb-4 flex-wrap">${utilitiesHtml}</div>
                                    <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                                        <span class="badge badge-kyc rounded-pill px-2 py-1">✔️ E-KYC</span>
                                        <button class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" onclick="window.location.href='room_detail.html?id=${room._id}'">Xem chi tiết</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
                })
                .catch(err => console.error("Lỗi:", err));
        });

        // Hàm Bỏ lưu ngay trên trang Yêu thích
        function removeSavedRoom(roomId) {
            let savedRooms = JSON.parse(localStorage.getItem('savedRooms')) || [];
            savedRooms = savedRooms.filter(id => id !== roomId);
            localStorage.setItem('savedRooms', JSON.stringify(savedRooms));
            
            // Xóa thẻ phòng đó khỏi giao diện
            document.getElementById(`room-card-${roomId}`).remove();
            
            // Cập nhật số lượng
            document.getElementById('saved-count').innerText = savedRooms.length;
            if (savedRooms.length === 0) {
                document.getElementById('empty-state').classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
