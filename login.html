<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UniMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5 app-container d-flex flex-column justify-content-center" style="min-height: 100vh;">
        <div class="card p-4 shadow-sm mx-auto" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <div class="text-start mb-3">
                    <a href="home.html" class="text-decoration-none text-muted small">← Quay lại Trang chủ</a>
                </div>
                <h3 class="text-primary fw-bold">Đăng nhập</h3>
                <p class="text-muted small">Chào mừng bạn quay lại với UniMatch</p>
            </div>

            <!-- Nơi hiển thị lỗi đỏ -->
            <div id="login-error" class="alert alert-danger p-2 small d-none" role="alert"></div>

            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Email sinh viên</label>
                <input id="login-email" type="email" class="form-control" placeholder="nguyenvanA@nttu.edu.vn">
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium text-secondary small">Mật khẩu</label>
                <input id="login-password" type="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>

            <button id="btn-login" class="btn btn-primary w-100 py-2 fw-bold mb-3" onclick="handleLogin()">
                Đăng nhập
            </button>
            
            <div class="text-center mb-3">
                <a href="forgot_password.html" class="text-decoration-none small fw-bold">Quên mật khẩu?</a>

                <div class="text-center small mt-3">
                    <span class="text-muted">Chưa có tài khoản? </span>
                    <a href="register.html" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            // 1. Reset trạng thái lỗi
            errorDiv.classList.add('d-none');
            errorDiv.innerText = '';

            // 2. Validate dữ liệu
            if (email === "" || password === "") {
                errorDiv.innerText = "⚠️ Vui lòng nhập đầy đủ Email và Mật khẩu.";
                errorDiv.classList.remove('d-none');
                return;
            }

            if (!email.endsWith(".edu.vn")) {
                errorDiv.innerText = "⚠️ Vui lòng sử dụng email sinh viên hợp lệ (có đuôi .edu.vn).";
                errorDiv.classList.remove('d-none');
                return;
            }

            // 3. Giả lập hiệu ứng Loading (Đang xử lý)
            btnLogin.innerHTML = '⏳ Đang đăng nhập...';
            btnLogin.disabled = true;

            // Đợi 1 giây rồi mới chuyển trang để tạo cảm giác hệ thống đang xử lý dữ liệu
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }
    </script>
</body>

</html>
