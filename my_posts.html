<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tin đăng - UniMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .post-card {
            transition: all 0.3s ease;
        }

        /* Hiệu ứng mờ đi khi tin bị ẩn hoặc đã cho thuê */
        .post-inactive {
            opacity: 0.6;
            filter: grayscale(40%);
        }

        .action-btn {
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="bg-light">
    <div id="navbar-placeholder"></div>

    <div class="container py-4" style="max-width: 1000px; min-height: 100vh;">

        <!-- Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold text-dark mb-0">📋 Quản lý tin đăng</h3>
                <p class="text-muted small mt-1 mb-0">Theo dõi và cập nhật trạng thái các bài đăng của bạn.</p>
            </div>
        </div>

        <!-- DANH SÁCH TIN ĐĂNG TỰ ĐỘNG ĐỔ VỀ TỪ MONGODB -->
        <div class="row g-4" id="my-posts-container">
            <!-- Dữ liệu sẽ tự động xuất hiện ở đây -->
        </div>

        <!-- Trạng thái trống (sẽ hiển thị khi xóa hết tin) -->
        <div id="empty-posts-state" class="text-center py-5 d-none">
            <div class="fs-1 mb-3">📝</div>
            <h5 class="fw-bold text-dark">Bạn chưa đăng tin nào</h5>
            <p class="text-muted small">Hãy đăng tin cho thuê phòng hoặc tìm người ở ghép để kết nối với mọi người.</p>
            <button class="btn btn-primary rounded-pill px-4 fw-bold mt-2"
                onclick="window.location.href='post_room.html'">Đăng tin đầu tiên</button>
        </div>

    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. HÀM TẢI DỮ LIỆU TỪ BACKEND
        function loadMyPosts() {
            fetch('http://localhost:3000/api/rooms')
                .then(res => res.json())
                .then(rooms => {
                    const container = document.getElementById('my-posts-container');
                    container.innerHTML = ''; // Dọn sạch rác cũ

                    if (rooms.length === 0) {
                        checkEmptyPosts();
                        return;
                    }

                    // Duyệt qua từng phòng và "vẽ" giao diện
                    rooms.forEach(room => {
                        // Trích xuất ngày hôm nay giả lập ngày đăng
                        const today = new Date().toLocaleDateString('vi-VN');

                        const postHTML = `
                            <div class="col-12" id="post-${room._id}">
                                <div class="card post-card shadow-sm border-0 overflow-hidden">
                                    <div class="row g-0">
                                        <div class="col-md-3">
                                            <img src="${room.image}" class="w-100 h-100" style="object-fit: cover; min-height: 180px;" alt="Phòng trọ">
                                        </div>
                                        <div class="col-md-9">
                                            <div class="card-body d-flex flex-column h-100 p-4">
                                                <div class="d-flex justify-content-between align-items-start mb-2 flex-wrap gap-2">
                                                    <h5 class="fw-bold text-dark mb-0">${room.title}</h5>
                                                    <span class="badge bg-success text-white px-3 py-2 rounded-pill fw-medium" id="status-badge-${room._id}">
                                                        🟢 Đang hiển thị
                                                    </span>
                                                </div>
                                                <p class="text-muted small mb-2">${room.address}</p>
                                                <h5 class="fw-bold text-primary mb-3">${room.price}</h5>

                                                <!-- Thống kê (Giả lập số liệu cho đẹp) -->
                                                <div class="d-flex gap-4 mb-3 small text-secondary fw-medium">
                                                    <span>👀 ${Math.floor(Math.random() * 100) + 10} lượt xem</span>
                                                    <span>❤️ ${Math.floor(Math.random() * 20)} người lưu</span>
                                                    <span>📅 Đăng ngày: ${today}</span>
                                                </div>

                                                <!-- Các nút hành động -->
                                                <div class="mt-auto d-flex gap-2 flex-wrap pt-3 border-top">
                                                    <button class="btn btn-outline-primary action-btn fw-bold rounded-pill px-3" onclick="alert('Chuyển đến trang Chỉnh sửa thông tin!')">✏️ Sửa tin</button>
                                                    <button class="btn btn-outline-warning action-btn fw-bold rounded-pill px-3" id="toggle-btn-${room._id}" onclick="togglePostVisibility('${room._id}')">👁️‍🗨️ Ẩn tin</button>
                                                    <button class="btn btn-outline-success action-btn fw-bold rounded-pill px-3" id="rented-btn-${room._id}" onclick="markAsRented('${room._id}')">🤝 Đã tìm được người</button>
                                                    <button class="btn btn-outline-danger action-btn fw-bold rounded-pill px-3 ms-auto" onclick="deletePost('${room._id}')">🗑️ Xóa</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += postHTML;
                    });
                })
                .catch(error => console.error('❌ Lỗi tải danh sách:', error));
        }

        // Tự động tải danh sách khi vừa mở trang
        document.addEventListener("DOMContentLoaded", loadMyPosts);

        // 2. HÀM ẨN / HIỆN TIN (Xử lý giao diện)
        function togglePostVisibility(postId) {
            const container = document.getElementById(`post-${postId}`);
            const card = container.querySelector('.card');
            const badge = document.getElementById(`status-badge-${postId}`);
            const toggleBtn = document.getElementById(`toggle-btn-${postId}`);
            
            const isHidden = card.classList.contains('post-inactive');

            if (isHidden) {
                card.classList.remove('post-inactive');
                badge.className = 'badge bg-success text-white px-3 py-2 rounded-pill fw-medium';
                badge.innerHTML = '🟢 Đang hiển thị';
                toggleBtn.className = 'btn btn-outline-warning action-btn fw-bold rounded-pill px-3';
                toggleBtn.innerHTML = '👁️‍🗨️ Ẩn tin';
            } else {
                card.classList.add('post-inactive');
                badge.className = 'badge bg-secondary text-white px-3 py-2 rounded-pill fw-medium';
                badge.innerHTML = '⚪ Đã ẩn';
                toggleBtn.className = 'btn btn-warning action-btn text-dark fw-bold rounded-pill px-3';
                toggleBtn.innerHTML = '👁️ Hiện tin lại';
            }
        }

        // 3. HÀM ĐÁNH DẤU CHO THUÊ XONG (Xử lý giao diện)
        function markAsRented(postId) {
            const confirmAction = confirm("Bạn có chắc chắn đánh dấu tin này là ĐÃ CHO THUÊ/TÌM ĐƯỢC NGƯỜI? Tin sẽ bị ẩn khỏi bảng tin chung.");
            if (!confirmAction) return;

            const container = document.getElementById(`post-${postId}`);
            const card = container.querySelector('.card'); 
            const badge = document.getElementById(`status-badge-${postId}`);
            const rentedBtn = document.getElementById(`rented-btn-${postId}`);
            const toggleBtn = document.getElementById(`toggle-btn-${postId}`);

            card.classList.add('post-inactive');
            badge.className = 'badge bg-primary text-white px-3 py-2 rounded-pill fw-medium';
            badge.innerHTML = '🤝 Đã giao dịch xong';
            rentedBtn.disabled = true;
            rentedBtn.innerHTML = '✅ Đã hoàn tất';
            toggleBtn.disabled = true; 
        }

        // 4. HÀM XÓA TIN ĐĂNG (KẾT NỐI API)
        function deletePost(postId) {
            const confirmDelete = confirm("⚠️ CẢNH BÁO: Bạn có chắc chắn muốn XÓA VĨNH VIỄN tin đăng này không? Dữ liệu không thể khôi phục.");
            if (!confirmDelete) return;

            // Bắn API gọi Node.js lên đường tiêu diệt dữ liệu
            fetch(`http://localhost:3000/api/rooms/${postId}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                // Xóa thành công trên Database thì mới Xóa trên Giao diện
                const container = document.getElementById(`post-${postId}`);
                
                // Hiệu ứng thu nhỏ trước khi bay màu
                container.style.transition = 'all 0.3s ease';
                container.style.opacity = '0';
                container.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    container.remove();
                    checkEmptyPosts();
                }, 300);
            })
            .catch(error => {
                alert("❌ Có lỗi xảy ra khi kết nối máy chủ!");
                console.error(error);
            });
        }

        // 5. HÀM KIỂM TRA DANH SÁCH TRỐNG
        function checkEmptyPosts() {
            const container = document.getElementById('my-posts-container');
            const emptyState = document.getElementById('empty-posts-state');
            
            if (container.children.length === 0) {
                emptyState.classList.remove('d-none');
            }
        }
    </script>

    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>

</html>
